name: Windows install ACL diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acl-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Measure owned install write denial and read/execute permissions
        run: node scripts/windows-acl-probe.mjs
      - name: Retain ACL diagnostic receipts without binary artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-acl-diagnostic
          include-hidden-files: true
          path: .qa/windows-acl-probe/*.json
          if-no-files-found: error
