name: Native Phase 1 package tests
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to test (a subset is not all-platform acceptance)
        type: choice
        required: true
        default: all
        options: [all, ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
      browser:
        description: Explicit QA browser (ci-edge is Windows-only, not OS-default routing)
        type: choice
        required: true
        default: ci-playwright
        options: [ci-playwright, ci-edge]
permissions:
  contents: read
jobs:
  package-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('{"all":["ubuntu-22.04","windows-2022","macos-15-intel","macos-15"],"ubuntu-22.04":["ubuntu-22.04"],"windows-2022":["windows-2022"],"macos-15-intel":["macos-15-intel"],"macos-15":["macos-15"]}')[inputs.target] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OPENROTMG_TEST_BROWSER_MODE: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Validate explicitly selected native browser
        run: node --input-type=module -e "import {assertNativeEdgeEnvironment} from './scripts/native-edge.mjs'; if(process.env.OPENROTMG_TEST_BROWSER_MODE==='ci-edge')assertNativeEdgeEnvironment(process.platform,process.arch,process.env.GITHUB_ACTIONS,JSON.parse(process.env.PI_NATIVE_TEST_CHROME_ARGS??'[]'));"
      - name: Install native test Chromium
        if: inputs.browser == 'ci-playwright'
        run: npm exec -- playwright install --with-deps chromium
      - name: Install private Linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11
      - name: Build exact native server and prepare verified client
        run: node scripts/ci-inputs.mjs
      - name: Allow controlled software WebGL on Linux QA only
        if: runner.os == 'Linux'
        shell: bash
        run: echo 'PI_NATIVE_TEST_CHROME_ARGS=["--ignore-gpu-blocklist","--disable-gpu-driver-bug-workarounds"]' >> "$GITHUB_ENV"
      - name: Package native runtime
        run: npm test && npm run package
      - name: Play through Linux client with OS-wide egress blocked
        if: runner.os == 'Linux'
        run: node scripts/offline-linux.mjs
      - name: Play through native client
        if: runner.os != 'Linux'
        run: node scripts/package-test.mjs
      - name: Retain small receipts and native screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .qa/package-tests/run-*/*.json
            .qa/package-tests/run-*/*.png
            .qa/package-tests/run-*/*.xml
            .qa/package-tests/run-*/*.log
            .qa/package-tests/run-*/*.jsonl
            .qa/package-tests/run-*/launcher-profile/*.json
            .qa/package-tests/run-*/launcher-profile/diagnostics/*.jsonl
            .qa/package-tests/run-*/initialization-profile/*.json
            .qa/package-tests/run-*/initialization-profile/diagnostics/*.jsonl
            .qa/package-tests/run-*/timeout-profile/*.json
            .qa/package-tests/run-*/timeout-profile/diagnostics/*.jsonl
            .qa/package-tests/run-*/startup-exit-close/*.json
            .qa/package-tests/run-*/startup-exit-close/diagnostics/*.jsonl
            .qa/package-tests/run-*/delayed-marker/*.json
            .qa/package-tests/run-*/delayed-marker/diagnostics/*.jsonl
            .qa/package-tests/run-*/unwritable-marker/*.json
            .qa/package-tests/run-*/unwritable-marker/diagnostics/*.jsonl
            .qa/integration/offline-proof.json
            .qa/ci-inputs/server-artifact.json
            runtime/build-identity.json
          if-no-files-found: warn
