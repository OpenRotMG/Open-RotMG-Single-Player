name: Read-only default-browser feasibility inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Inventory resolution and namespace feasibility only (no browser execution)
        run: node scripts/default-browser-inventory-probe.mjs
      - name: Preserve partial inventory even when not ready or inspection fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-browser-inventory-${{ matrix.os }}
          include-hidden-files: true
          path: .qa/default-browser-inventory/result.json
          if-no-files-found: error
