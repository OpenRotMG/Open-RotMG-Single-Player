name: Read-only installed Edge installer-metrics header evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics-format:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Read only installed signed Edge numeric SetupMetrics files
        run: node scripts/windows-metrics-format-probe.mjs
      - name: Retain bounded headers and source hash binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-edge-metrics-format
          include-hidden-files: true
          path: .qa/windows-edge-metrics-format/*
          if-no-files-found: error
