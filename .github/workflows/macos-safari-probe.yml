name: macOS Safari capability diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Enable standard Safari automation in this dedicated job VM
        run: sudo -n /usr/bin/safaridriver --enable
      - name: Measure normal built-in Safari WebGL2 capability
        run: node scripts/macos-safari-probe.mjs
      - name: Retain capability diagnostics, not game acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safari-${{ matrix.os }}
          include-hidden-files: true
          path: .qa/mac-safari-probe/*
          if-no-files-found: error
