name: Focused Windows terrain paths and packaged startup validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-path-validation:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Build exact fork QA server and prepare pinned client (not moving upstream main)
        run: node scripts/ci-inputs.mjs
      - name: Require native Windows drive/key, junction and real 13-recipe catalog regressions
        run: node scripts/windows-path-validation.mjs
      - name: Test harness and package actual Electron runtime
        run: npm test && npm run package
      - name: Focused packaged startup health stop and failure ownership only (NOT game graphics or offline acceptance)
        run: node scripts/package-test.mjs --failure-tests-only
      - name: Retain focused receipts and actual native diagnostics (no full-game claim)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-path-focused-validation
          include-hidden-files: true
          path: |
            .qa/windows-path-validation/*.json
            .qa/windows-path-validation/*.log
            .qa/ci-inputs/build-inputs.json
            .qa/ci-inputs/server-artifact.json
            runtime/build-identity.json
            .qa/package-tests/run-*/*.json
            .qa/package-tests/run-*/*.png
            .qa/package-tests/run-*/*.log
            .qa/package-tests/run-*/*.jsonl
            .qa/package-tests/run-*/launcher-profile/*.json
            .qa/package-tests/run-*/launcher-profile/diagnostics/*.jsonl
            .qa/package-tests/run-*/startup-exit-close/*.json
            .qa/package-tests/run-*/startup-exit-close/diagnostics/*.jsonl
            .qa/package-tests/run-*/delayed-marker/*.json
            .qa/package-tests/run-*/delayed-marker/diagnostics/*.jsonl
            .qa/package-tests/run-*/unwritable-marker/*.json
            .qa/package-tests/run-*/unwritable-marker/diagnostics/*.jsonl
          if-no-files-found: error
