name: Portable offline ZIPs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENROTMG_TEST_BROWSER_MODE: ci-playwright
      PI_NATIVE_TEST_CHROME_ARGS: '["--ignore-gpu-blocklist"]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - name: Require the hosted Linux runner's display and archive tools
        if: runner.os == 'Linux'
        run: for tool in Xvfb xauth dbus-run-session unzip zip unshare setpriv; do command -v "$tool"; done
      - name: Test launcher code
        # Parallel macOS spawn tests can inherit a sibling test's flock before exec closes it.
        run: npm ci && npm test && cargo test --locked --manifest-path launcher/Cargo.toml -- --test-threads=1
      - name: Build the pinned server and client from source
        run: node scripts/ci-inputs.mjs
      - name: Make the portable ZIP with the server, client and Ruffle inside
        run: npm run make
      - name: Collect release assets and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/installer-inputs.mjs
      - name: Install CI browser/display test tools (not consumer dependencies)
        run: npm exec -- playwright install chromium
      - name: Play the extracted ZIP offline, then update from the published launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OPENROTMG_TEST_TMP_ROOT="$RUNNER_TEMP/ins"
          target=$(node -p "process.platform+'-'+process.arch")
          gh release download v1.0.0 --repo OpenRotMG/Open-RotMG-Single-Player --pattern "openrotmg-singleplayer-1.0.0-$target.zip" --dir "$RUNNER_TEMP/legacy"
          export OPENROTMG_LEGACY_ZIP="$RUNNER_TEMP/legacy/openrotmg-singleplayer-1.0.0-$target.zip"
          artifact=$(ls .qa/installer-delivery/openrotmg-singleplayer-*.zip)
          if [ "$RUNNER_OS" = Linux ]; then node scripts/offline-linux.mjs "$artifact"; else npm run verify:release -- "$artifact"; fi
      - name: Retain delivery and test evidence in Actions only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-installer-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .qa/installer-delivery/*
            .qa/installer-tests/run-*/installer-result.json
            .qa/installer-tests/run-*/*.png
            .qa/installer-tests/run-*/*.log
