name: macOS ARM offline policy diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - name: Measure OS-enforced egress denial with normal sandboxed WebGL2
        run: node scripts/macos-offline-probe.mjs
      - name: Retain policy and process diagnostics, not game acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm-offline-policy
          include-hidden-files: true
          path: .qa/mac-offline-probe/*
          if-no-files-found: error
