name: Read-only Linux default-browser target metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Inventory Linux resolution and rejected target attributes only
        run: node scripts/default-browser-inventory-probe.mjs
      - name: Preserve partial inventory even when not ready or inspection fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-browser-inventory-ubuntu-22.04
          include-hidden-files: true
          path: .qa/default-browser-inventory/result.json
          if-no-files-found: error
