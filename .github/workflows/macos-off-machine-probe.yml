name: Mac off-machine TCP policy diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  off-machine-probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - name: Verify own IPv4 routes and measure both confined normal payloads
        run: node scripts/macos-offline-probe.mjs --off-machine-egress
      - name: Retain off-machine boundary evidence, not strict127 or game acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm-off-machine-policy
          include-hidden-files: true
          path: .qa/mac-off-machine-probe/*
          if-no-files-found: error
