name: macOS graphics capability diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install chromium
      - name: Measure independent normal, ANGLE Metal and ANGLE OpenGL configurations
        run: node scripts/macos-graphics-probe.mjs
      - name: Retain capability diagnostics, not package acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphics-${{ matrix.os }}
          include-hidden-files: true
          path: .qa/mac-graphics-probe/*
          if-no-files-found: error
