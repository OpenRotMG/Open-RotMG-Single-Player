name: Focused native Windows state read-permission denial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-denied:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Build exact paired native server and prepare pinned client
        run: node scripts/ci-inputs.mjs
      - name: Validate source and package real native Electron runtime
        run: npm test && npm run package
      - name: Focused real OS read-denied state rejection only
        run: node scripts/package-test.mjs --windows-state-read-denied
      - name: Preserve partial ACL, state, UI, build and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-state-read-denied
          include-hidden-files: true
          path: |
            .qa/ci-inputs/build-inputs.json
            .qa/ci-inputs/server-artifact.json
            runtime/build-identity.json
            .qa/package-tests/run-*/*.json
            .qa/package-tests/run-*/*.png
            .qa/package-tests/run-*/launcher-profile/diagnostics/*.jsonl
          if-no-files-found: error
