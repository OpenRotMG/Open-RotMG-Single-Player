[package]
name = "openrotmg-singleplayer"
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
fs2 = "0.4.3"
dunce = "1.0.5"
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
